
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f8fc">
<title>BessaGonCC — Download Manager</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap');

:root {
  --bg: #f7f8fc;
  --surface: #ffffff;
  --text: #191c20;
  --muted: #707782;
  --blue: #0b57d0;
  --blue-bg: #e8f0fe;
  --border: #e8eaf0;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Google Sans", Roboto, sans-serif;
}

header {
  height: 76px;
  display: flex;
  align-items: center;
  padding: 0 7%;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(18px);
  position: sticky;
  top: 0;
  z-index: 5;
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -.6px;
}

.logo {
  width: 40px;
  height: 40px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: var(--blue-bg);
  color: var(--blue);
}

.logo svg {
  width: 23px;
  height: 23px;
}

main {
  max-width: 1000px;
  margin: 0 auto;
  padding: 62px 24px 90px;
}

.intro {
  margin-bottom: 36px;
  animation: appear .6s ease both;
}

.eyebrow {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.8px;
  color: var(--blue);
  margin-bottom: 13px;
}

h1 {
  font-size: clamp(32px, 5vw, 48px);
  letter-spacing: -2px;
  line-height: 1.12;
  margin: 0 0 13px;
  font-weight: 600;
}

.intro p {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.7;
  margin: 0;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 0 0 16px;
}

.section-heading h2 {
  font-size: 17px;
  font-weight: 600;
  margin: 0;
}

.count {
  color: var(--muted);
  font-size: 13px;
}

.files {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 15px;
}

.file-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 21px;
  display: flex;
  align-items: center;
  gap: 15px;
  min-width: 0;
  transition: transform .22s ease, box-shadow .22s ease,
              border-color .22s ease;
  animation: appear .5s ease both;
}

.file-card:hover {
  transform: translateY(-4px);
  border-color: #c7d7f5;
  box-shadow: 0 10px 30px rgba(31, 58, 100, .07);
}

.file-icon {
  width: 53px;
  height: 57px;
  border-radius: 17px;
  background: #f0f3fa;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.file-icon.game {
  background: #e7f5ed;
  color: #188653;
}

.file-icon svg {
  width: 27px;
  height: 27px;
}

.file-info {
  min-width: 0;
  flex: 1;
}

.file-title {
  font-size: 15px;
  font-weight: 600;
  overflow-wrap: anywhere;
  margin-bottom: 8px;
}

.file-type {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
  background: #f3f4f7;
  border-radius: 6px;
  padding: 5px 8px;
}

.file-type.game {
  color: #137648;
  background: #e7f5ed;
}

.download {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  border-radius: 50%;
  background: var(--blue-bg);
  color: var(--blue);
  transition: background .2s, transform .2s;
  text-decoration: none;
}

.download:hover {
  background: #d4e3ff;
  transform: scale(1.08);
}

.download:active {
  transform: scale(.92);
}

.download svg {
  width: 21px;
  height: 21px;
}

.empty {
  grid-column: 1 / -1;
  background: white;
  border: 1px dashed #d9dfe9;
  padding: 45px 20px;
  text-align: center;
  border-radius: 22px;
  color: var(--muted);
}

footer {
  margin-top: 45px;
  text-align: center;
  font-size: 12px;
  color: #9298a2;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 620px) {
  header {
    padding: 0 20px;
    height: 68px;
  }

  .brand {
    font-size: 17px;
  }

  main {
    padding: 42px 17px 60px;
  }

  .files {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .file-card {
    padding: 17px;
    border-radius: 19px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12m-5-5 5 5 5-5"/>
        <path d="M5 16v4h14v-4"/>
      </svg>
    </div>
    BessaGonCC
  </div>
</header>

<main>
  <section class="intro">
    <div class="eyebrow">Your downloads, simplified</div>
    <h1>Download Manager<span style="color:#0b57d0">.</span></h1>
    <p>Everything you need, all in one place.</p>
  </section>

  <section>
    <div class="section-heading">
      <h2>Available files</h2>
      <span class="count" id="file-count">0 files</span>
    </div>

    <div class="files" id="files"></div>
  </section>

  <footer>
    BessaGonCC · Simple downloads. No clutter.
  </footer>
</main>

<script>
/*
  ADD YOUR FILES HERE.

  Each file has exactly 3 parameters:
  isgame = true or false
  link   = URL to the file
  title  = displayed name

  Replace the example links with your real download URLs.
*/

const files = [
  {
    isgame: true,
    link: "https://example.com/my-game.zip",
    title: "My Game"
  },
  {
    isgame: false,
    link: "https://example.com/my-file.zip",
    title: "My Download"
  }
];

const downloadIcon = `
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12m-5-5 5 5 5-5"/>
    <path d="M5 16v4h14v-4"/>
  </svg>
`;

const gameIcon = `
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 9h12a4 4 0 0 1 3.8 5l-1 3a2.5 2.5 0 0 1-4 1.1L14 16h-4l-2.8 2.1A2.5 2.5 0 0 1 3.2 17l-1-3A4 4 0 0 1 6 9Z"/>
    <path d="M7 12v4m-2-2h4"/>
    <circle cx="16.5" cy="12.5" r=".8" fill="currentColor"/>
    <circle cx="18.5" cy="14.5" r=".8" fill="currentColor"/>
  </svg>
`;

const fileIcon = `
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10Z"/>
    <path d="M13 3v7h7"/>
    <path d="M8 15h8m-8 3h6"/>
  </svg>
`;

const container = document.getElementById("files");

document.getElementById("file-count").textContent =
  `${files.length} ${files.length === 1 ? "file" : "files"}`;

if (files.length === 0) {
  container.innerHTML = `
    <div class="empty">No files available yet.</div>
  `;
}

files.forEach((file, index) => {
  const card = document.createElement("article");
  card.className = "file-card";
  card.style.animationDelay = `${index * 70}ms`;

  const icon = file.isgame ? gameIcon : fileIcon;
  const type = file.isgame ? "Game" : "File";
  const validLink = typeof file.link === "string" &&
    /^(https?:\/\/|\/|\.\/|\.\.\/)/i.test(file.link);

  card.innerHTML = `
    <div class="file-icon ${file.isgame ? "game" : ""}">
      ${icon}
    </div>
    <div class="file-info">
      <div class="file-title"></div>
      <span class="file-type ${file.isgame ? "game" : ""}">
        ${type}
      </span>
    </div>
    <a class="download"
       aria-label="Download ${escapeAttribute(file.title)}"
       title="Download"
       ${validLink
         ? `href="${escapeAttribute(file.link)}"`
         : 'href="#" aria-disabled="true"'}
       ${validLink ? "download" : ""}>
      ${downloadIcon}
    </a>
  `;

  card.querySelector(".file-title").textContent = file.title;
  container.appendChild(card);
});

function escapeAttribute(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}
</script>

</body>
</html>
